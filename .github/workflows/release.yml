name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: brew install dav1d

      - name: Install dependencies
        run: npm ci

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Sync icons
        run: npm run sync-icons

      - name: Prepare Tauri resources
        run: npm run tauri:prepare-resources

      - name: Test
        run: npm test

      - name: Build Tauri app and DMG
        run: npm run tauri -- build --bundles dmg

      - name: Sign release DMG
        run: bash scripts/sign-macos-release.sh

      - name: Verify macOS bundle
        run: bash scripts/verify-release-bundle.sh

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          DMG=$(find src-tauri/target -name 'DropSlim_*.dmg' -path '*/release/bundle/dmg/*' | head -1)
          test -f "$DMG"

          ARGS=(gh release create "$TAG" "$DMG" --title "DropSlim $TAG" --generate-notes)
          if [[ "$TAG" == *beta* || "$TAG" == *rc* || "$TAG" == *alpha* ]]; then
            ARGS+=(--prerelease)
          fi

          "${ARGS[@]}" || gh release upload "$TAG" "$DMG" --clobber
