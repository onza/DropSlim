name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect Rust-related changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'test/**'

  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          HUSKY: 0

      - name: Lint, format, UI build
        run: npm run ci:check

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            gifsicle-path: vendor/gifsicle/gifsicle
            install-dav1d: brew install dav1d
            skip_gifsicle: ''
          - os: windows-latest
            gifsicle-path: vendor/gifsicle/gifsicle.exe
            install-dav1d: echo "dav1d builds from source on Windows"
            skip_gifsicle: '1'

    runs-on: ${{ matrix.os }}
    env:
      CI_SKIP_GIFSICLE: ${{ matrix.skip_gifsicle }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache Homebrew
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            brew-${{ runner.os }}-

      - name: Install system dependencies
        run: ${{ matrix.install-dav1d }}

      - name: Cache gifsicle binary
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        id: gifsicle-cache
        with:
          path: ${{ matrix.gifsicle-path }}
          key: gifsicle-${{ runner.os }}-${{ runner.arch }}-1.96

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Rust tests
        run: npm run ci:rust
