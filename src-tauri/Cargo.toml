[package]
name = "dropslim"
version = "1.0.0"
description = "Optimize your images and graphics in a single drag and drop."
authors = ["Martin Farkas"]
edition = "2021"

[lib]
name = "dropslim_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
image = { version = "0.25.10", features = ["avif-native", "webp", "jpeg", "png", "gif"] }
imagequant = "4.4.1"
png = "0.18.1"
zenjpeg = "0.8"
webp = "0.3.1"
ravif = "0.13.0"
walkdir = "2.5.0"
oxvg_ast = { version = "0.0.5", features = ["parse", "roxmltree", "visitor", "serialize"] }
oxvg_optimiser = "0.0.5"
oxipng = "10.1.1"

[dev-dependencies]
tempfile = "3.27.0"
image = { version = "0.25.10", features = ["avif-native", "webp", "jpeg", "png", "gif"] }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSOpenPanel", "NSPanel"] }
