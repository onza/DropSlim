[package]
name = "dropslim"
version = "1.6.3"
description = "Optimize your images and graphics in a single drag and drop."
authors = ["Martin Farkas"]
edition = "2021"

[lib]
name = "dropslim_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "dropslim-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dropslim-core = { path = "../crates/dropslim-core" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"
image = { version = "0.25.10", features = ["avif-native", "webp", "jpeg", "png", "gif"] }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSOpenPanel", "NSPanel"] }
objc2-core-foundation = { version = "0.3", features = ["CFData", "CFDictionary", "CFNumber", "CFString", "CFURL"] }
objc2-image-io = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# native-tls: System-Zertifikatsspeicher (Security.framework / SChannel).
# Default rustls-tls kann auf macOS mit "error sending request for url" scheitern.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
tauri-plugin-process = "2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
rfd = "0.15"
