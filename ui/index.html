<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>DropSlim</title>
    <link rel="stylesheet" href="styles/dropslim.css" />
  </head>
  <body>
    <div class="titlebar-drag" data-tauri-drag-region aria-hidden="true"></div>
    <div class="wrapper">
      <div class="app-main">
        <section id="dragzone">
          <p id="dragzoneStatus" class="dragzone-status" hidden></p>
          <h1 data-i18n="dragzone.title"></h1>
          <strong data-i18n="formats.supported"></strong>
          <p
            id="dragzoneOutputFormat"
            class="dragzone-output-format"
            hidden
          ></p>
        </section>
        <div class="results-panel">
          <p id="batchSummary" class="batch-summary" hidden></p>
          <section id="result"></section>
        </div>
      </div>
      <section id="menuSettings">
        <div class="settings-content">
          <h3 data-i18n="settings.title"></h3>
          <div class="setting-row">
            <span
              class="setting-label"
              data-i18n="settings.saveInSameFolder"
            ></span>
            <label class="toggle">
              <input
                id="folderswitch"
                name="folderswitch"
                type="checkbox"
                checked
              />
              <span class="toggle-track" aria-hidden="true"></span>
            </label>
          </div>
          <div id="wrapperSavePath" class="save-path is-hidden">
            <span
              class="save-path-label"
              data-i18n="settings.chooseFolder"
            ></span>
            <button
              type="button"
              id="btnSavepath"
              class="btn"
              data-i18n="settings.chooseFolderOpen"
            ></button>
          </div>
          <div class="setting-row">
            <span class="setting-label" data-i18n="settings.minSuffix"></span>
            <label class="toggle">
              <input id="suffix" name="suffix" type="checkbox" checked />
              <span class="toggle-track" aria-hidden="true"></span>
            </label>
          </div>
          <div class="setting-row">
            <span
              class="setting-label"
              data-i18n="settings.minifiedSubfolder"
            ></span>
            <label class="toggle">
              <input id="subfolder" name="subfolder" type="checkbox" />
              <span class="toggle-track" aria-hidden="true"></span>
            </label>
          </div>
          <div class="setting-row">
            <span
              class="setting-label"
              data-i18n="settings.limitDimensions"
            ></span>
            <label class="toggle">
              <input
                id="limit_dimensions"
                name="limit_dimensions"
                type="checkbox"
              />
              <span class="toggle-track" aria-hidden="true"></span>
            </label>
          </div>
          <div id="wrapperDimensionLimits" class="dimension-limits is-hidden">
            <p
              class="dimension-limits-hint"
              data-i18n="settings.limitDimensionsHint"
            ></p>
            <label class="dimension-limits-field" for="max_width">
              <span
                class="dimension-limits-label"
                data-i18n="settings.maxWidth"
              ></span>
              <input
                id="max_width"
                name="max_width"
                type="number"
                min="1"
                step="1"
                inputmode="numeric"
              />
            </label>
            <label class="dimension-limits-field" for="max_height">
              <span
                class="dimension-limits-label"
                data-i18n="settings.maxHeight"
              ></span>
              <input
                id="max_height"
                name="max_height"
                type="number"
                min="1"
                step="1"
                inputmode="numeric"
              />
            </label>
          </div>
          <div class="setting-row setting-row--output-format">
            <span
              id="settingsOutputFormatLabel"
              class="setting-label"
              data-i18n="settings.outputFormat"
            ></span>
            <label class="locale-picker" for="outputFormatSelect">
              <span class="locale-picker-display">
                <span id="outputFormatValue" class="locale-picker-value"></span>
                <span class="locale-picker-icon" aria-hidden="true">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="m6 9 6 6 6-6" />
                  </svg>
                </span>
              </span>
              <select
                id="outputFormatSelect"
                class="locale-picker-select"
                name="output_format"
                aria-labelledby="settingsOutputFormatLabel"
              ></select>
            </label>
          </div>
          <p
            class="output-format-hint"
            data-i18n="settings.outputFormatHint"
          ></p>
          <div class="setting-row">
            <span class="setting-label" data-i18n="settings.clearOnNew"></span>
            <label class="toggle">
              <input id="clearlist" name="clearlist" type="checkbox" />
              <span class="toggle-track" aria-hidden="true"></span>
            </label>
          </div>
          <div class="setting-row">
            <span
              class="setting-label"
              data-i18n="settings.autoCheckUpdates"
            ></span>
            <label class="toggle">
              <input
                id="autoCheckUpdates"
                name="autoCheckUpdates"
                type="checkbox"
                checked
              />
              <span class="toggle-track" aria-hidden="true"></span>
            </label>
          </div>
          <div class="setting-row">
            <span
              class="setting-label"
              data-i18n="settings.autoInstallUpdates"
            ></span>
            <label class="toggle">
              <input
                id="autoInstallUpdates"
                name="autoInstallUpdates"
                type="checkbox"
              />
              <span class="toggle-track" aria-hidden="true"></span>
            </label>
          </div>
          <div class="setting-row setting-row--locale">
            <span
              id="settingsLanguageLabel"
              class="setting-label"
              data-i18n="settings.language"
            ></span>
            <label class="locale-picker" for="localeSelect">
              <span class="locale-picker-display">
                <span id="localeValue" class="locale-picker-value"></span>
                <span class="locale-picker-icon" aria-hidden="true">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="m6 9 6 6 6-6" />
                  </svg>
                </span>
              </span>
              <select
                id="localeSelect"
                class="locale-picker-select"
                name="locale"
                aria-labelledby="settingsLanguageLabel"
              ></select>
            </label>
          </div>
          <div class="setting-row setting-row--updates">
            <span class="setting-label" data-i18n="settings.updates"></span>
            <button
              type="button"
              id="btnCheckUpdates"
              class="btn"
              data-i18n="updates.checkNow"
            ></button>
          </div>
        </div>
      </section>
      <footer class="app-footer">
        <div class="app-footer-meta">
          <p id="appVersion" class="app-version" aria-live="polite"></p>
          <p id="updateStatus" class="update-status" aria-live="polite"></p>
        </div>
        <div class="app-footer-actions">
          <button
            type="button"
            id="btnCancelOptimization"
            class="text-btn"
            hidden
            data-i18n="footer.cancel"
          ></button>
          <button
            type="button"
            id="btnOpenSettings"
            class="text-btn"
            data-i18n="footer.settings"
          ></button>
          <button
            type="button"
            id="btnCloseSettings"
            class="text-btn"
            data-i18n="footer.close"
          ></button>
        </div>
      </footer>
    </div>
    <div
      id="confirmDialog"
      class="confirm-dialog is-hidden"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
      aria-labelledby="confirmDialogTitle"
    >
      <div class="confirm-dialog-backdrop"></div>
      <div class="confirm-dialog-panel">
        <h2 id="confirmDialogTitle" class="confirm-dialog-title"></h2>
        <p id="confirmDialogBody" class="confirm-dialog-body"></p>
        <label class="confirm-dialog-dont-ask" for="confirmDialogDontAsk">
          <input id="confirmDialogDontAsk" type="checkbox" />
          <span id="confirmDialogDontAskLabel"></span>
        </label>
        <div class="confirm-dialog-actions">
          <button
            type="button"
            id="confirmDialogCancel"
            class="text-btn"
          ></button>
          <button
            type="button"
            id="confirmDialogConfirm"
            class="btn confirm-dialog-confirm"
          ></button>
        </div>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
