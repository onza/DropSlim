[package]
name = "dropslim-cli"
version = "1.6.3-feature-cli.1"
description = "DropSlim command-line image optimizer"
authors = ["Martin Farkas"]
edition = "2021"
license = "MIT"

[[bin]]
name = "dropslim"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dropslim-core = { path = "../dropslim-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3.27.0"
image = { version = "0.25.10", features = ["png", "jpeg"] }
